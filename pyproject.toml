[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algoradar"
version = "0.1.0"
description = "AI Competitive Programming Weakness Analyzer and Problem Recommender"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "requests>=2.31",
  "joblib>=1.3",
  "streamlit>=1.36",
  "plotly>=5.22",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2"]

[tool.setuptools.packages.find]
include = ["algoradar*"]
